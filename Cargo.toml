[package]
name = "excra"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Exact Cargo-resolved Rust dependency APIs for coding agents"
license = "MIT OR Apache-2.0"
repository = "https://github.com/adamDucken/excra"
readme = "README.md"
keywords = ["rustdoc", "cargo", "agents", "dependencies", "cli"]
categories = ["command-line-utilities", "development-tools"]
publish = ["crates-io"]

[[bin]]
name = "excra"
path = "src/main.rs"

[dependencies]
cargo_metadata = "0.18"
html-to-markdown-rs = { version = "3", default-features = false, features = ["visitor"] }
syn = { version = "2", default-features = false, features = ["full", "parsing"] }

[dev-dependencies]
tempfile = "3"
